<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>services</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="services.css" />
  </head>
  <body>
    <section class="services">
      <h2 class="services__header services__header-text">
        Ремонт техники различных брендов
      </h2>

      <!-- Slider main container -->
      <div class="swiper swiper-desktop">
        <!-- Additional required wrapper -->
        <ul class="swiper-wrapper swiper-wrapper-desktop">
          <!-- Slides -->

          <li class="swiper-slide services__slide">
            <a href="#" class="swiper-slide__link">
              <img src="img/logos/main/services/lenovo.svg" alt="lenovo" />
              <img src="img/logos/main/services/go.svg" alt="Показать" />
            </a>
          </li>

          <li class="swiper-slide services__slide">
            <a href="#" class="swiper-slide__link">
              <img src="img/logos/main/services/samsung.svg" alt="samsung" />
              <img src="img/logos/main/services/go.svg" alt="Показать" />
            </a>
          </li>

          <li class="swiper-slide services__slide">
            <a href="#" class="swiper-slide__link">
              <img src="img/logos/main/services/apple.svg" alt="apple" />
              <img src="img/logos/main/services/go.svg" alt="Показать" />
            </a>
          </li>

          <li class="swiper-slide services__slide">
            <a href="#" class="swiper-slide__link">
              <img
                src="img/logos/main/services/viewSonic.svg"
                alt="viewSonic"
              />
              <img src="img/logos/main/services/go.svg" alt="Показать" />
            </a>
          </li>

          <li class="swiper-slide services__slide">
            <a href="#" class="swiper-slide__link">
              <img src="img/logos/main/services/bosch.svg" alt="bosch" />
              <img src="img/logos/main/services/go.svg" alt="Показать" />
            </a>
          </li>

          <li class="swiper-slide services__slide">
            <a href="#" class="swiper-slide__link">
              <img src="img/logos/main/services/hp.svg" alt="hp" />
              <img src="img/logos/main/services/go.svg" alt="Показать" />
            </a>
          </li>

          <li class="swiper-slide services__slide">
            <a href="#" class="swiper-slide__link">
              <img src="img/logos/main/services/acer.svg" alt="acer" />
              <img src="img/logos/main/services/go.svg" alt="Показать" />
            </a>
          </li>

          <li class="swiper-slide services__slide">
            <a href="#" class="swiper-slide__link">
              <img src="img/logos/main/services/sony.svg" alt="sony" />
              <img src="img/logos/main/services/go.svg" alt="Показать" />
            </a>
          </li>

          <li class="swiper-slide services__slide">
            <a href="#" class="swiper-slide__link">
              <img src="img/logos/main/services/lenovo.svg" alt="lenovo" />
              <img src="img/logos/main/services/go.svg" alt="Показать" />
            </a>
          </li>

          <li class="swiper-slide services__slide">
            <a href="#" class="swiper-slide__link">
              <img src="img/logos/main/services/samsung.svg" alt="samsung" />
              <img src="img/logos/main/services/go.svg" alt="Показать" />
            </a>
          </li>

          <li class="swiper-slide services__slide">
            <a href="#" class="swiper-slide__link">
              <img src="img/logos/main/services/apple.svg" alt="apple" />
              <img src="img/logos/main/services/go.svg" alt="Показать" />
            </a>
          </li>
        </ul>
        <!-- If we need pagination -->
        <div class="swiper-pagination"></div>
      </div>

      <div class="show-all">
        <button class="show-all__button">
          <span data-text-hide="Скрыть" class="read-more__text"
            >Показать все
          </span>
        </button>
      </div>
    </section>

    <!-- Кнопка "Показать все" -->
    <script src="js/toggle-services.js"></script>

    <!-- Подключение скриптов JavaScript swiper-->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Инициализация свайпера -->
    <script src="js/swiper-init.js"></script>
  </body>
</html>
